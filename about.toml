# cargo-about: лицензии зависимостей для THIRD_PARTY_LICENSES.html (см. package.ps1).
# Список — допустимые для распространения в составе exe. Новая лицензия в дереве
# зависимостей → генерация упадёт: проверить её и добавить сюда осознанно.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    "NCSA",
    # Встроенные шрифты egui (Ubuntu-Light).
    "Ubuntu-font-1.0",
    # Корневые сертификаты webpki-roots (загрузка картинок по https).
    "CDLA-Permissive-2.0",
]
# Только то, что попадает в exe под Windows.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
