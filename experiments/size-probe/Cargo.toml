[package]
name = "size-probe"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
egui_commonmark = "0.25.0"
merman = { version = "0.9.0", default-features = false, features = ["all-diagrams", "complete-svg"] }
resvg = "0.48.1"
rfd = "0.17.2"

[profile.release]
lto = false
codegen-units = 16
strip = false
panic = "abort"
