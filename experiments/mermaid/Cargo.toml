[package]
name = "mermaid-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
mermaid-little = { version = "11.14.0-6", default-features = false, features = ["metrics-ttf-parser"] }
mermaid-render = "0.10.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mermaid-svg = "0.7.0"
merman = { version = "0.9.0", default-features = false, features = ["all-diagrams", "complete-svg"] }
resvg = "0.48.1"
serde_json = "1.0.154"
